name: CI

# Экономный режим:
# - ветка без PR — один быстрый прогон (ubuntu, Node 22);
# - pull request и main — полная матрица 3 ОС × Node 20/22, acceptance и audit;
# - новый пуш отменяет устаревший прогон той же ветки или PR (main досчитывается всегда).
# Перед пушем локально: npm run check.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quick:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    name: quick / ubuntu-latest / Node 22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  full:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run --json
      - run: npm run acceptance

  audit:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
